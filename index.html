  async function collectFolder(id,items,depth=0){if(depth>14||items.length>=600)return;const children=await driveChildren(id);for(const item of children){if(items.length>=600)break;if(item.folder)await collectFolder(item.id,items,depth+1);else if(isMedia(item))items.push(item)}}
  async function fetchDriveBlob(item){const metadata=await graph(`/me/drive/items/${encodeURIComponent(item.id)}`);const url=metadata['@microsoft.graph.downloadUrl'];if(url&&url.startsWith('https://')){const response=await fetch(url,{redirect:'follow'});if(!response.ok)throw new Error(`OneDrive download returned ${response.status}`);return response.blob()}const token=await driveToken();const response=await fetch(`https://graph.microsoft.com/v1.0/me/drive/items/${encodeURIComponent(item.id)}/content`,{headers:{Authorization:`Bearer ${token}`}});if(!response.ok)throw new Error(`Download returned ${response.status}`);return response.blob()}
  async function importDriveFolder(){if(driveBusy)return;driveBusy=true;const label=$('#drive-status');if(label)label.textContent='Scanning the folder and its subfolders…';try{const items=[];await collectFolder(state.oneDriveFolder||'root',items);if(!items.length){toast('No image or video files found in this folder.');return}let saved=0,linked=0;const previous=new Set(state.media.filter(x=>x.driveId).map(x=>x.driveId));for(let i=0;i<items.length;i++){const file=items[i];if(previous.has(file.id))continue;const item=captureTemplate(file.name,file.file.mimeType?.startsWith('video/')||/\.(mp4|mov|webm|m4v)$/i.test(file.name)?'video':'image','onedrive');item.driveId=file.id;item.size=file.size||0;item.remoteWebUrl=file.webUrl||'';if(label)label.textContent=`Importing file ${i+1} of ${items.length}: ${file.name}`;try{if(item.size>250*1024*1024)throw new Error('Large file: link only');const blob=await fetchDriveBlob(file);await dbPut(item.id,blob);saved++}catch(e){console.warn('Cloud capture linked, offline download not saved',file.name,e);item.offline=true;linked++}state.media.unshift(item);previous.add(file.id);if(i%5===0)save()}save();render();toast(`OneDrive import finished: ${saved} stored, ${linked} linked only. ${items.length>=600?'Reached the 600-file per import limit.':''}`)}catch(e){console.error(e);toast(`OneDrive import failed: ${e.message}`)}finally{driveBusy=false}}
  async function disconnectDrive(){try{const client=await initMsal();await client.logoutRedirect({account:driveAccount,postLogoutRedirectUri:location.origin+location.pathname});driveAccount=null;driveClient=null;render()}catch(e){toast(e.message)}}
  async function copyText(value){try{await navigator.clipboard.writeText(value);toast('Copied to clipboard.')}catch{const t=document.createElement('textarea');t.value=value;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('Copied.') }}
  async function handleAction(action,el){switch(action){
    case 'go-gameday':return route('gameday');case 'go-highlights':return route('highlights');case 'go-timeline':return route('timeline');case 'go-newsroom':return route('newsroom');case 'go-settings':return route('settings');
    case 'upload-media':return $('#media-upload').click();case 'upload-gameday':return $('#gameday-upload').click();case 'add-album':{const name=prompt('Name your new scrapbook (for example, “Iowa State Road Trip”):');if(name?.trim()){const n=name.trim().slice(0,65);if(!state.collection.includes(n)){state.collection.push(n);save();render();toast('Scrapbook created.')}else toast('That scrapbook already exists.')}return}
    case 'show-all-albums':state.chosenAlbum=null;save();return render();
    case 'close-modal':return closeModal();case 'save-media':return saveMedia();case 'download-media':return downloadMedia();case 'delete-media':{if(!currentModal||!confirm('Remove this capture from J4SN? This does not delete the OneDrive original.'))return;const id=currentModal;state.media=state.media.filter(x=>x.id!==id);save();await dbDelete(id).catch(console.warn);mediaURLs.delete(id);closeModal();render();return}
    case 'upload-notes':return $('#article-upload').click();case 'generate-story':return draftStory();case 'copy-prompt':return copyText(storyPrompt());case 'ai-story':return aiStory();case 'publish-story':return publishStory();case 'clear-story':return clearStory();case 'edit-story':return editStory(el.dataset.id);case 'read-story':state.openArticle=el.dataset.id;state.active='article';save();render();window.scrollTo(0,0);return;case 'delete-story':if(confirm('Delete this fictional article?')){state.articles=state.articles.filter(x=>x.id!==el.dataset.id);state.active='newsroom';save();render()}return;
    case 'update-picks':syncMatch();render();return toast('The analyst picks were refreshed using team strengths and news impact ratings.');case 'save-game':{syncMatch();const entry=state.extraGames.find(x=>x.week===state.week&&x.matchup.away===state.matchup.away&&x.matchup.home===state.matchup.home);if(entry)entry.matchup=structuredClone(state.matchup);else state.extraGames.push({id:uid('game'),week:state.week,matchup:structuredClone(state.matchup)});save();render();toast('Game added to this week’s matchup slate.');return}case 'new-game':{syncMatch();const away=prompt('New matchup: away team name?');if(!away?.trim())return;const home=prompt('New matchup: home team name?');if(!home?.trim())return;state.matchup={...BASE.matchup,away:away.trim().slice(0,60),home:home.trim().slice(0,60),date:'Kickoff TBD',notes:'',awayOffense:75,awayDefense:75,homeOffense:75,homeDefense:75,awayNews:0,homeNews:0};state.gameDayImage=null;save();render();toast('New matchup loaded. Set ratings and the article impact.');return}case 'save-hat':return saveHat();case 'download-gameday':return downloadPoster();case 'next-week':return nextWeek();
    case 'save-client-id':{const id=$('#client-id').value.trim();if(id&&!/^[0-9a-f-]{36}$/i.test(id)){toast('That does not look like a Microsoft client ID.');return}state.oneDriveClientId=id;driveClient=null;driveAccount=null;save();render();toast('Microsoft app ID saved locally.');return}
    case 'onedrive-connect':return connectDrive();case 'onedrive-disconnect':return disconnectDrive();case 'browse-onedrive':state.oneDrivePath=[{id:'root',name:'OneDrive root'}];return showFolder('root','OneDrive root',true);case 'import-folder':return importDriveFolder();
    case 'export-project':return exportProject();case 'import-project':return $('#backup-upload').click();case 'download-all':return downloadAllMedia();case 'reset-project':if(confirm('Reset the local site metadata, storyline edits, and hat box? Imported capture files will remain in browser storage but no longer appear in the gallery.')){state=structuredClone(BASE);save();route('home')}return;
    default:console.warn('Unhandled click action',action)
  }}
  document.addEventListener('click',async ev=>{const el=ev.target.closest('[data-action],[data-nav],[data-article],[data-media],[data-album],[data-drive-folder],[data-drive-back],[data-slate]');if(!el)return;ev.preventDefault();try{if(el.dataset.nav)return route(el.dataset.nav);if(el.dataset.article){state.openArticle=el.dataset.article;state.active='article';save();render();window.scrollTo(0,0);return}if(el.dataset.media)return openMedia(el.dataset.media);if(el.dataset.slate){const match=state.extraGames.find(x=>x.id===el.dataset.slate);if(match){state.matchup=structuredClone(match.matchup);state.gameDayImage=null;save();render();window.scrollTo({top:0,behavior:'smooth'});toast('Featured matchup selected.')}return}if(el.dataset.album){state.chosenAlbum=el.dataset.album;save();render();return}if(el.dataset.driveBack){state.oneDrivePath.pop();const previous=state.oneDrivePath.at(-1);const prev=previous&&typeof previous==='object'?previous:{id:'root',name:'OneDrive root'};return showFolder(prev.id,prev.name,true)}if(el.dataset.driveFolder){const found=driveItems.find(x=>x.id===el.dataset.driveFolder);if(found)return showFolder(found.id,found.name)}if(el.dataset.action)return handleAction(el.dataset.action,el)}catch(e){console.error(e);toast(e.message||'That action could not complete.')}});
  document.addEventListener('input',ev=>{if(['story-title','story-script','story-preview'].includes(ev.target.id)){syncDraft()}if(ev.target.id==='media-search'){state.search=ev.target.value;save();render();const el=$('#media-search');el?.focus();el?.setSelectionRange(state.search.length,state.search.length)}});
  document.addEventListener('change',ev=>{if(ev.target.id==='kind-filter'){state.kind=ev.target.value;save();render()}if(ev.target.id==='album-filter'){state.album=ev.target.value;save();render()}if(['story-reporter','story-section'].includes(ev.target.id))syncDraft()});
  $('#media-upload').addEventListener('change',async e=>{await importFiles(e.target.files);e.target.value=''});
  $('#article-upload').addEventListener('change',async e=>{try{const f=e.target.files?.[0];if(!f)return;if(f.size>1024*1024)throw new Error('Please use a text file smaller than 1 MB.');const contents=await f.text();if(!contents.trim())throw new Error('The file is empty.');state.storyTitle=f.name.replace(/\.(txt|md)$/i,'').slice(0,180);state.storyScript=contents;state.storyPreview='';state.storyArticleId=null;state.active='newsroom';save();render();toast('Article notes imported. Choose Draft from Script, then publish after review.')}catch(err){toast('Could not import article notes: '+err.message)}finally{e.target.value=''}});
  $('#gameday-upload').addEventListener('change',async e=>{try{const f=e.target.files?.[0];if(!f)return;syncMatch();state.gameDayImage=await imageDataURL(f);save();render();toast('Your GameDay image is ready for the weekly poster.')}catch(e){toast('This image could not be added.')}finally{e.target.value=''}});
  $('#backup-upload').addEventListener('change',async e=>{try{const file=e.target.files?.[0];if(!file)return;const newState=JSON.parse(await file.text());if(!newState||!Array.isArray(newState.articles)||!Array.isArray(newState.media))throw new Error('Not a J4SN project backup.');if(!confirm('Import this project? It replaces your existing project metadata. Stored media files will not be deleted.'))return;state={...structuredClone(BASE),...newState};state.active='home';save();render();toast('Project metadata imported. Only media whose files still exist on this device will preview.')}catch(err){toast(`Import failed: ${err.message}`)}finally{e.target.value=''}});
  $('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});
  window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
  async function boot(){render();if(state.oneDriveClientId&&location.protocol!=='file:'){try{await initMsal();render()}catch(e){console.warn('Microsoft token not restored:',e.message)}}}
  boot();
})();

</script>
